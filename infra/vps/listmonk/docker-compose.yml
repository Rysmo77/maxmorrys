# ─────────────────────────────────────────────────────────────────────────────
# LISTMONK — la moitié marketing du courrier, sur le VPS.
#
# À FUSIONNER dans /opt/maxmorrys-stack/docker-compose.yml, qui porte déjà Typesense,
# n8n et NocoDB. Ce fichier n'est pas destiné à être lancé seul : il décrit les deux
# services à ajouter, avec les conventions du stack.
#
# ── POURQUOI PAS BREVO DIRECTEMENT ──
# Brevo est un SaaS exclusif : il n'existe aucune édition installable. Listmonk tient les
# listes, les segments, les campagnes, le désabonnement et les statistiques ICI, et ne
# délègue que l'ACHEMINEMENT à Brevo par SMTP. La donnée reste sur le VPS.
#
# ── CE QUI SUIT LES CONVENTIONS DU STACK, ET POURQUOI ──
#   · Version ÉPINGLÉE, jamais `latest` — comme `typesense/typesense:30.2`. Un `latest`
#     transforme un `docker compose pull` de routine en migration de schéma non planifiée.
#   · AUCUN port publié : Caddy joint le conteneur par le réseau docker, exactement comme
#     Typesense sur son 8108 interne. Publier 9000 exposerait une console d'administration
#     sur l'IP publique, sous la seule protection d'un mot de passe.
#   · Deux réseaux : `internal` pour le couple app/base, `khanouss_default` parce que c'est
#     par lui que Caddy atteint les conteneurs.
#   · Secrets dans /opt/maxmorrys-stack/.env, jamais ici.
# ─────────────────────────────────────────────────────────────────────────────

services:
  maxmorrys-listmonk:
    image: listmonk/listmonk:v6.2.0
    container_name: maxmorrys-listmonk
    restart: unless-stopped
    depends_on:
      maxmorrys-listmonk-db:
        condition: service_healthy
    environment:
      # L'adresse d'écoute est 0.0.0.0 DANS le conteneur : c'est le réseau docker qui
      # l'isole, pas l'interface. Caddy est le seul à pouvoir l'atteindre.
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: maxmorrys-listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:?LISTMONK_DB_PASSWORD manquant dans .env}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      # Renseignés UNIQUEMENT au premier démarrage, pour créer le super-administrateur.
      # À retirer du .env une fois le compte créé : le laisser réécrirait le mot de passe
      # à chaque redémarrage, et le rendrait lisible par tout ce qui lit ce fichier.
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-}
    volumes:
      - maxmorrys_listmonk_uploads:/listmonk/uploads
    networks:
      - internal
      - khanouss_default

  maxmorrys-listmonk-db:
    image: postgres:17-alpine
    container_name: maxmorrys-listmonk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:?LISTMONK_DB_PASSWORD manquant dans .env}
      POSTGRES_DB: listmonk
    volumes:
      - maxmorrys_listmonk_data:/var/lib/postgresql/data
    # Le `depends_on` de l'app attend cette sonde et non le simple démarrage : Postgres
    # accepte des connexions avant d'être pret, et Listmonk sort en erreur s'il arrive trop
    # tot — un redemarrage en boucle qui ne se voit que dans les journaux.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

volumes:
  maxmorrys_listmonk_data:
  maxmorrys_listmonk_uploads:

networks:
  internal:
  khanouss_default:
    external: true
