name: SEO — ce que la production sert vraiment

# `seo:check` était la seule barrière du dépôt sans rendez-vous. Elle existait, elle était
# sérieuse — et elle ne tournait que quand quelqu'un y pensait. C'est ainsi que trois
# articles ont pu être déclarés deux fois au sitemap, avec des `hreflang` contradictoires,
# sans que rien ne le dise.
#
# ⚠️ POURQUOI CE N'EST PAS DANS LA CI DE CHAQUE LIVRAISON. Le contrôle interroge la
# PRODUCTION : dans le CI d'une PR, il testerait le déploiement PRÉCÉDENT. Vert ou rouge,
# son verdict ne porterait pas sur le code proposé — et un garde qui juge autre chose que
# ce qu'on lui soumet apprend surtout à être ignoré.
#
# ⚠️ CE QU'IL VOIT ET QUE LA CI NE PEUT PAS VOIR. Le SEO de ce site est produit par le
# Worker Cloudflare, que la CI ne déploie pas (`wrangler deploy` reste manuel). Entre le
# dépôt et ce que lisent les robots, il y a donc une étape que personne n'automatise. Ce
# job est le seul endroit d'où l'écart se voit.
#
# Il échantillonne une URL par famille. Pour tout passer au crible :
#   node scripts/seo-check.mjs --all

on:
  schedule:
    # Lundi, 07:30 UTC — après `proof-links`, pour que les deux constats de la semaine
    # arrivent ensemble plutôt qu'à deux moments qu'il faut rapprocher à la main.
    - cron: '30 7 * * 1'
  workflow_dispatch:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Aucun `npm ci` : le script n'utilise que la bibliothèque standard de Node, y compris
      # son lecteur d'en-têtes PNG/JPEG. Même raisonnement que `proof-links`.
      - name: Le sitemap et les pages se contredisent-ils ?
        run: npm run seo:check

      # ── LE WORKER N'HÉRITE D'AUCUN EN-TÊTE DE L'ORIGINE ──────────────────
      # Il fabrique ses Response lui-même : `applySecurityHeaders` recopie les sept
      # en-têtes de sécurité À LA MAIN. Leur perte ne se voit dans aucun rendu, et c'est
      # une régression que ce dépôt a déjà connue une fois.
      #
      # ⚠️ `--headers-only` N'EST PAS UNE PRÉCAUTION, C'EST LE SEUL MODE ENCORE VALIDE.
      # La comparaison complète supposait que l'origine prérendait elle aussi, via ses
      # rewrites vers des Cloud Functions. Ces fonctions ont été supprimées : l'origine
      # sert le shell nu, le Worker sert le pré-rendu, et la divergence est devenue le but
      # du dispositif. Mesuré le 05/09/2026 : 18 routes sur 19 divergent, toutes
      # légitimement. Câbler ce mode-là rendrait le job rouge en permanence, donc ignoré.
      - name: Le Worker a-t-il gardé les en-têtes de l'origine ?
        run: node worker/scripts/origin-parity.mjs https://max-morrys.web.app https://maxmorrys.me --headers-only
