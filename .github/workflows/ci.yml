name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Frontend ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # ── Les six règles du design system, rendues exécutables ──────────────
      # Elles ne se voient sur AUCUNE capture d'écran : le flou de trop, le repli qui ignore
      # le thème, le nombre affiché sans source rendent correctement sur la machine de qui
      # les écrit. Ils ne se manifestent que sur l'appareil, le thème ou le réglage
      # d'accessibilité de quelqu'un d'autre — donc jamais en revue.
      #
      # `ds:check` prouve aussi AD-1 : que `src/design-system/css/` est bien la COPIE
      # LITTÉRALE du kit livré. Cette étape n'existait pas ; la source de `ds:sync` avait
      # entre-temps été supprimée du dépôt et le script plantait à l'exécution, sans que
      # rien ne le signale. Un vérificateur qu'aucun job n'invoque ne vérifie rien.
      - name: Design system — six règles + copie littérale (AD-1)
        run: npm run ds:check

      # ── Le contrat des vues, et ses deux consommateurs générés ───────────
      # ⭐ MÊME MOTIF QUE `ds:check`, POUR LA MÊME RAISON : la porte qui mord est celle qui
      # COMPARE DEUX ARTEFACTS, jamais celle qui affirme une constante. On régénère
      # `contrat.ts` et `Vues.kt` dans un dossier temporaire et on diffère : une retouche à la
      # main, ou un contrat modifié sans régénération, échoue ici.
      #
      # La même commande vérifie les ROUTES : l'ensemble des callables du contrat doit ÉGALER
      # l'ensemble des clés `app*` de `HANDLERS`, et chacune doit figurer dans LES DEUX listes
      # `MIGRATED`. Un nom absent de la liste ne tombe pas en erreur franche — il part au relais
      # mort et reçoit la page HTML 404 de Google, ce qui se lit comme une panne de réseau. Sur
      # un téléphone il n'y a pas de console : quelqu'un ira vérifier son forfait avant de
      # soupçonner une liste de configuration. C'est ce défaut-là qui a coûté le paiement du Club.
      #
      # ⚠️ Les deux moitiés tournent ENSEMBLE, délibérément : `npm run vues:check --routes` ne
      # passerait pas le drapeau (npm avale les options placées après le nom du script), et une
      # porte qu'il faut penser à invoquer est une porte qui ne tourne pas.
      - name: Contrat des vues — la source contre ses consommateurs
        run: npm run vues:check

      # Les suites unitaires gardent la cohérence des prix (Club, offre TPE) entre le code,
      # les CGV et l'interface. Sans cette étape elles n'avaient AUCUNE couverture CI, et
      # c'est ainsi que les CGV ont pu annoncer un tarif que le code ne pratiquait plus.
      - name: Unit tests
        run: npm test

      # ── Les cartes d'aperçu de partage ───────────────────────────────────
      # Elles sont rendues au build et VERSIONNÉES : `og:check` vérifie qu'aucune page —
      # statique ou question de la FAQ — n'annonce une carte dont le fichier n'existe pas.
      #
      # Le défaut qu'il attrape ne casse rien de visible : la réécriture d'hébergement
      # rattrape la page manquante sur la carte générique, et le lien garde une vignette.
      # Mais c'est exactement la vignette générique qu'on vient de supprimer, et elle
      # reviendrait page par page sans qu'aucune erreur n'apparaisse.
      - name: Cartes d'aperçu — couverture
        run: npm run og:check

      # ── Une donnée contre la phrase qui la décrit ────────────────────────
      # Ce que les autres gardes ne regardent pas : un aveu écrit en dur qui survit à la
      # matière qu'il réclamait, une date de relevé gelée dans une traduction, une preuve
      # posée sur une clé de jalon qui n'existe plus. Rien de tout ça ne casse quoi que ce
      # soit — ça fait seulement mentir les pages dont le métier est d'être vérifiables,
      # et ça ne se voit d'aucune capture d'écran.
      #
      # Hors ligne, donc dans la CI de chaque livraison. Le contrôle des URLs publiées
      # (`proof:links`) a son propre rendez-vous hebdomadaire : un site tiers qui tombe un
      # mardi doit se voir, pas bloquer une livraison.
      - name: Preuves — la donnée contre sa description
        run: npm run proof:check

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

  # Cloudflare Workers : typecheck + tests unitaires du monorepo worker/.
  # Ils n'étaient couverts par aucun job — tsconfig.app.json n'inclut que src/.
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Typecheck workers
        run: npm run typecheck
        working-directory: worker

      - name: Test workers
        run: npm test
        working-directory: worker

  # Firestore security-rules tests against the emulator (needs Java 21).
  # Kept as a separate job so it doesn't gate deploys while the suite grows.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  # ══════════════════════════════════════════════════════════════════════════════════
  # L'APPLICATION NATIVE — jusqu'ici, RIEN dans cette CI ne la regardait.
  #
  # ══════════════════════════════════════════════════════════════════════════════════
  # ANDROID — LE JOB QUI REMPLACE `mobile`, ET CE QU'IL NE COUVRE PAS ENCORE.
  #
  # L'ancien job faisait `expo export`, la seule porte qui prouvait que le paquet se
  # CONSTRUIT — un typecheck vert avait déjà caché un projet impossible à bundler.
  # `assembleDebug` joue le même rôle ici, et il est le dernier mot : c'est la
  # compilation qui prouve, pas l'analyse statique.
  #
  # ⚠️ CE JOB NE VÉRIFIE QUE LE SOCLE. Les 110 cas perdus avec `mobile/` ne sont pas
  # revenus : rien ne garde encore les contrôles morts, les liens vers des routes
  # inexistantes, ni le rendu des écrans — ils n'existent pas. Voir
  # `_bmad-output/implementation-artifacts/garanties-a-reconstruire.md`.
  #
  # ⚠️ IL N'Y A PAS DE JOB iOS. Il attend une installation de Xcode, qui n'est pas
  # automatisable ici. Un `xcodebuild` sur runner macos le remplacera.
  # ══════════════════════════════════════════════════════════════════════════════════
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # ⛔ LA DÉRIVE DES JETONS EST GARDÉE AILLEURS, ET C'EST VOULU.
      #
      # `Jetons.generated.kt` et les trois fichiers de ressources sont GÉNÉRÉS depuis le
      # CSS (AD-8). Rien n'empêche de les modifier à la main — une teinte changée là
      # compile, s'affiche, et ne redevient jamais celle du design. `ds:check` régénère
      # les CINQ cibles et compare ; il tourne dans `lint-and-build`, dont dépend le
      # déploiement. Le refaire ici coûterait un `npm ci` complet pour la même réponse.
      #
      # ⚠️ Si `ds:check` cessait un jour de connaître les cibles Android, ce job
      # continuerait de passer au vert sur des jetons faux. C'est le seul point où ces
      # deux fichiers doivent rester d'accord.

      - name: Compiler l'application
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Tests unitaires
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint Android
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      # `aapt2` sur le paquet construit, et non un grep du manifeste source : l'outil
      # officiel a déjà corrigé ici une lecture par chaînes qu'on croyait juste.
      - name: Permissions réellement demandées par le paquet
        working-directory: android
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: max-morrys

  preview:
    if: github.event_name == 'pull_request'
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: max-morrys
