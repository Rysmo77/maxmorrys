name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Frontend ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # ── Les six règles du design system, rendues exécutables ──────────────
      # Elles ne se voient sur AUCUNE capture d'écran : le flou de trop, le repli qui ignore
      # le thème, le nombre affiché sans source rendent correctement sur la machine de qui
      # les écrit. Ils ne se manifestent que sur l'appareil, le thème ou le réglage
      # d'accessibilité de quelqu'un d'autre — donc jamais en revue.
      #
      # `ds:check` prouve aussi AD-1 : que `src/design-system/css/` est bien la COPIE
      # LITTÉRALE du kit livré. Cette étape n'existait pas ; la source de `ds:sync` avait
      # entre-temps été supprimée du dépôt et le script plantait à l'exécution, sans que
      # rien ne le signale. Un vérificateur qu'aucun job n'invoque ne vérifie rien.
      - name: Design system — six règles + copie littérale (AD-1)
        run: npm run ds:check

      # Les suites unitaires gardent la cohérence des prix (Club, offre TPE) entre le code,
      # les CGV et l'interface. Sans cette étape elles n'avaient AUCUNE couverture CI, et
      # c'est ainsi que les CGV ont pu annoncer un tarif que le code ne pratiquait plus.
      - name: Unit tests
        run: npm test

      # ── Les cartes d'aperçu de partage ───────────────────────────────────
      # Elles sont rendues au build et VERSIONNÉES : `og:check` vérifie qu'aucune page —
      # statique ou question de la FAQ — n'annonce une carte dont le fichier n'existe pas.
      #
      # Le défaut qu'il attrape ne casse rien de visible : la réécriture d'hébergement
      # rattrape la page manquante sur la carte générique, et le lien garde une vignette.
      # Mais c'est exactement la vignette générique qu'on vient de supprimer, et elle
      # reviendrait page par page sans qu'aucune erreur n'apparaisse.
      - name: Cartes d'aperçu — couverture
        run: npm run og:check

      # ── Une donnée contre la phrase qui la décrit ────────────────────────
      # Ce que les autres gardes ne regardent pas : un aveu écrit en dur qui survit à la
      # matière qu'il réclamait, une date de relevé gelée dans une traduction, une preuve
      # posée sur une clé de jalon qui n'existe plus. Rien de tout ça ne casse quoi que ce
      # soit — ça fait seulement mentir les pages dont le métier est d'être vérifiables,
      # et ça ne se voit d'aucune capture d'écran.
      #
      # Hors ligne, donc dans la CI de chaque livraison. Le contrôle des URLs publiées
      # (`proof:links`) a son propre rendez-vous hebdomadaire : un site tiers qui tombe un
      # mardi doit se voir, pas bloquer une livraison.
      - name: Preuves — la donnée contre sa description
        run: npm run proof:check

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

  # Cloudflare Workers : typecheck + tests unitaires du monorepo worker/.
  # Ils n'étaient couverts par aucun job — tsconfig.app.json n'inclut que src/.
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Typecheck workers
        run: npm run typecheck
        working-directory: worker

      - name: Test workers
        run: npm test
        working-directory: worker

  # Firestore security-rules tests against the emulator (needs Java 21).
  # Kept as a separate job so it doesn't gate deploys while the suite grows.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  # ══════════════════════════════════════════════════════════════════════════════════
  # L'APPLICATION NATIVE — jusqu'ici, RIEN dans cette CI ne la regardait.
  #
  # `mobile/` est un projet Expo autonome, avec son propre `package-lock.json`. Les deux
  # suites `tests/unit/mobile-*.test.ts` tournaient bien, mais par accident : elles sont
  # dans la suite de la racine et lisent des fichiers. Ni le typecheck de `mobile/`, ni
  # sa construction n'étaient exécutés — une régression TypeScript ou un import cassé
  # partait sans que rien ne le dise.
  #
  # ⚠️ ET LE TYPECHECK NE SUFFIT PAS. `tsc` résout des chemins que Metro refuse : le port
  # a déjà connu un état où le typecheck était vert et le paquet impossible à construire
  # (`Unable to resolve module ../../src/design-system/tokens.generated`). L'export est
  # la seule porte qui prouve que l'application se construit.
  # ══════════════════════════════════════════════════════════════════════════════════
  # LE JOB `mobile` A ÉTÉ RETIRÉ LE 05/09/2026, avec le dossier qu'il vérifiait.
  #
  # Il faisait tourner `npm ci`, le typecheck natif, `expo-doctor` et surtout
  # `expo export` — la seule porte qui prouvait que le paquet se CONSTRUIT, là où un
  # typecheck vert avait déjà caché un projet impossible à bundler.
  #
  # L'application est réécrite en Kotlin/Compose et en Swift/SwiftUI. Deux jobs le
  # remplaceront : un `./gradlew` sur runner ubuntu, un `xcodebuild` sur runner macos.
  # Tant qu'ils n'existent pas, RIEN NE VÉRIFIE l'application mobile — c'est écrit ici
  # pour que le silence de la CI ne se lise pas comme une absence de problème.
  #
  # Les garanties perdues sont inventoriées, une par une, dans
  # `_bmad-output/implementation-artifacts/garanties-a-reconstruire.md`.
  # ══════════════════════════════════════════════════════════════════════════════════

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: max-morrys

  preview:
    if: github.event_name == 'pull_request'
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FUNCTIONS_ORIGIN: ${{ vars.VITE_FUNCTIONS_ORIGIN }}
          # Sans cette ligne, `initSentry()` sort au premier `if` et la supervision
          # d'erreurs n'existe pas — en production comme en local. Le paquet est installé
          # et l'appel est fait : seule la valeur manquait. Voir `src/lib/sentry.ts`.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Les identifiants de mesure. Ils étaient écrits en dur dans `index.html`, si
          # bien que dev et preview alimentaient les propriétés de PRODUCTION.
          # Le repli `||` n'est pas décoratif : sans lui, une variable de dépôt oubliée
          # laisserait le jeton non substitué et couperait la mesure en production —
          # une régression pire que le défaut qu'on corrige.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID || 'GTM-PJ3R433M' }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || '925361066071417' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: max-morrys
