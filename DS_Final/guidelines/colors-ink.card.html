<!-- @dsCard group="Couleurs" viewport="700x150" name="Encre et papier" subtitle="Trois encres, trois papiers, un filet" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--f-body);color:var(--ink);background:#FBFCFE;padding:18px}*{box-sizing:border-box}.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}.hex{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.s{border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line)}.c{height:50px}.m{padding:6px 8px;background:#fff}</style></head><body>
<div class="g">
<div class="s"><div class="c" style="background:var(--ink)"></div><div class="m"><span class="hex">ink<br>0E1116</span></div></div>
<div class="s"><div class="c" style="background:var(--ink-2)"></div><div class="m"><span class="hex">ink-2<br>5A6472</span></div></div>
<div class="s"><div class="c" style="background:var(--ink-3)"></div><div class="m"><span class="hex">ink-3<br>98A1AE</span></div></div>
<div class="s"><div class="c" style="background:var(--paper)"></div><div class="m"><span class="hex">paper<br>FFFFFF</span></div></div>
<div class="s"><div class="c" style="background:var(--paper-2)"></div><div class="m"><span class="hex">paper-2<br>F5F7F9</span></div></div>
<div class="s"><div class="c" style="background:var(--paper-3)"></div><div class="m"><span class="hex">paper-3<br>EDF0F4</span></div></div>
<div class="s"><div class="c" style="background:var(--line)"></div><div class="m"><span class="hex">line<br>E2E7EC</span></div></div>
</div></body></html>
