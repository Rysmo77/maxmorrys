<!-- @dsCard group="Marque" viewport="700x210" name="Repli, et le thème" subtitle="Le repli appareil-modeste connaît le mode : blanc à 90 % en clair, à 11 % en sombre" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{font-family:var(--f-body);background:var(--paper-2);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
*{box-sizing:border-box}
.demo{position:relative;border-radius:var(--r-l);overflow:hidden;height:178px;isolation:isolate}
.inner{position:relative;z-index:3;padding:14px;display:grid;gap:9px}
.lbl{position:absolute;right:9px;top:9px;z-index:5;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:5px}
.t{font-size:12px;font-weight:600;margin:0}
.h{font-family:var(--f-mono);font-size:9.5px;margin:2px 0 0}
</style></head><body>
<div class="demo lowfi">
  <div class="mesh m-forme"><b style="width:200px;height:200px"></b><b style="width:200px;height:200px"></b><b style="width:200px;height:200px"></b></div>
  <span class="lbl" style="background:rgba(255,255,255,.86);color:var(--ink)">.lowfi · clair</span>
  <div class="inner">
    <div class="glass" style="padding:11px"><p class="t">Panneau</p><p class="h" style="color:var(--ink-2)">blanc à 90 % · flou coupé</p></div>
    <div class="truth" style="padding:11px"><p class="t">Encart de vérité</p><p class="h" style="color:var(--ink-2)">blanc à 88 %</p></div>
  </div>
</div>
<div class="demo lowfi dk">
  <div class="mesh m-forme"><b style="width:200px;height:200px"></b><b style="width:200px;height:200px"></b><b style="width:200px;height:200px"></b></div>
  <span class="lbl" style="background:rgba(11,14,19,.86);color:#ECF0F5">.lowfi · sombre</span>
  <div class="inner">
    <div class="glass" style="padding:11px"><p class="t" style="color:#ECF0F5">Panneau</p><p class="h" style="color:#A2ADBB">blanc à 11 % · flou coupé</p></div>
    <div class="truth" style="padding:11px"><p class="t" style="color:#ECF0F5">Encart de vérité</p><p class="h" style="color:#A2ADBB">blanc à 9 %</p></div>
  </div>
</div>
</body></html>
