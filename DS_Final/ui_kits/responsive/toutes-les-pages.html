<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Max-Morrys — les 24 pages de tableau de bord</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0}
body{background:#0A0D11;color:#E9EDF2;font-family:var(--f-body);padding:22px 20px 96px}
*{box-sizing:border-box}
.wrap{max-width:1440px;margin:0 auto}
.wrap > .cap{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7C8896;margin:0 0 12px}
.wrap > .cap b{display:block;margin-top:4px;font-family:var(--f-display);font-size:22px;font-weight:900;letter-spacing:-.03em;text-transform:none;color:#fff}
.wrap > .cap i{font-style:normal;color:#FFC46B}
.pager{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;display:flex;flex-wrap:wrap;justify-content:center;
  max-width:1400px;gap:4px;background:rgba(10,13,17,.9);backdrop-filter:blur(14px);padding:7px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}
.pager button{border:0;cursor:pointer;border-radius:999px;padding:7px 11px;font-family:var(--f-body);font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.1);color:#C3CDD9}
.pager button.on{background:#fff;color:#0E1116}
.pager u{align-self:center;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);text-decoration:none;padding:0 6px 0 10px}
::-webkit-scrollbar{display:none}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../ui_kits/guard.js"></script>
<script type="text/babel" src="Dashboards.js"></script>

<script type="text/babel" src="DashboardsConsole.js"></script>
<script type="text/babel" src="DashboardsConsole2.js"></script>
</head><body><div class="wrap"><p class="cap" id="legende"></p><div id="vue"></div></div><div class="pager" id="pager"></div>
<script type="text/babel">
/* Les 24 pages : 5 pour l'espace apprenant, 19 pour la console.
   L'ordre du sélecteur suit celui des deux navigations, pas un ordre de création. */
const PAGES = [
  ['app','Espace apprenant'],
  ['EspaceDesktop','Mon espace','Rôle apprenant','la reprise reste le premier objet'],
  ['CoursDesktop','Mes cours','Rôle apprenant','ce qu\'elle possède, pas ce qu\'elle pourrait acheter'],
  ['RepetiteurDesktop','Mon répétiteur','Rôle apprenant','mémoire et renommage visibles pendant la conversation'],
  ['ClubDesktop','Le Club','Rôle apprenant','le bilan d\'abonnement est permanent, pas terminal'],
  ['ProfilDesktop','Mon profil','Rôle apprenant','deux colonnes de travail, aucun panneau de contexte'],
  ['sep','Console · pilotage'],
  ['ConsoleDesktop','Tableau de bord','Rôle administrateur','s\'ouvre sur ce qui bloque'],
  ['TransactionsDesktop','Transactions','Rôle administrateur','rejouer un webhook est sans risque, et l\'écran le dit'],
  ['UtilisateursDesktop','Utilisateurs','Rôle administrateur','5 comptes, dernier le 10 mars'],
  ['sep','Commerce'],
  ['ProspectsDesktop','Prospects','Rôle support','avec son coût en minutes'],
  ['ProjetsDesktop','Projets','Rôle administrateur','zéro projet suit de zéro demande'],
  ['CouponsDesktop','Coupons','Rôle administrateur','un code épuisé reste visible'],
  ['sep','Contenu'],
  ['FormationsDesktop','Formations','Rôle administrateur','la checklist EST la définition de publiable'],
  ['ArticlesDesktop','Articles','Rôle administrateur','47 brouillons, 1 sans version anglaise'],
  ['PodcastsDesktop','Podcasts','Rôle administrateur','un épisode, transcrit'],
  ['VideosDesktop','Vidéos','Rôle administrateur','deux qualités obligatoires avant publication'],
  ['FaqDesktop','FAQ','Rôle administrateur','12 questions, aucune URL propre'],
  ['sep','Club'],
  ['EvenementsDesktop','Événements','Rôle administrateur','la session a lieu même à quatre'],
  ['DefisDesktop','Défis','Rôle administrateur','zéro, et la raison du zéro'],
  ['TemoignagesDesktop','Témoignages','Rôle administrateur','approuver ne publie nulle part'],
  ['sep','Réglages'],
  ['RedirectionsDesktop','Redirections','Rôle administrateur','les segments d\'URL sont traduits, pas redirigés'],
  ['PopupsDesktop','Pop-ups','Rôle administrateur','deux arrêtées, avec leur motif'],
  ['NotificationsDesktop','Notifications','Rôle administrateur','aucun canal d\'envoi n\'existe'],
  ['RendezVousDesktop','Rendez-vous','Rôle administrateur','le coût que ce zéro cache'],
  ['ParametresDesktop','Paramètres','Rôle administrateur','les prix sont des miroirs de la base']
];

/* Un seul état, tenu hors de React : le sélecteur vit en DOM direct pour qu'un changement
   de vue ne le remonte pas. Vingt-quatre boutons remontés à chaque clic, ce serait
   vingt-quatre nœuds recréés pour un attribut de classe. */
let courant = 'EspaceDesktop';
const racine = ReactDOM.createRoot(document.getElementById('vue'));
function monter(){
  const D = window.MMDASH || {};
  const item = PAGES.find(p=>p[0]===courant);
  const V = D[courant];
  const l = document.getElementById('legende');
  l.textContent = item[2];
  const b = document.createElement('b'); b.textContent = item[1]+' · 1440 × 900';
  const i = document.createElement('i'); i.textContent = ' · '+item[3];
  l.appendChild(b); l.appendChild(i);
  racine.render(React.createElement(window.MMBoundary,{key:courant}, V ? React.createElement(V) : null));
  [].forEach.call(document.querySelectorAll('.pager button'), function(n){
    n.className = n.dataset.k === courant ? 'on' : '';
  });
}
const pager = document.getElementById('pager');
PAGES.forEach(function(p){
  if (p[0]==='sep' || p[0]==='app'){
    const u = document.createElement('u'); u.textContent = p[1]; pager.appendChild(u); return;
  }
  const b = document.createElement('button');
  b.textContent = p[1]; b.dataset.k = p[0];
  b.onclick = function(){ courant = p[0]; monter(); };
  pager.appendChild(b);
});
monter();
</script></body></html>
