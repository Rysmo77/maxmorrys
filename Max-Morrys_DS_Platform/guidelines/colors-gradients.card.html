<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--f-body);color:var(--ink);background:#FBFCFE;padding:18px}*{box-sizing:border-box}.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}.hex{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{border-radius:var(--r-l);height:98px;border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 28px rgba(14,17,22,.10);padding:12px;display:flex;flex-direction:column;justify-content:flex-end}.s b{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:-.03em}</style></head><body>
<div class="g">
<div class="s" style="background:linear-gradient(150deg,var(--g-forme-1),var(--g-forme-2))"><b>forme</b><span class="hex">D6E8FF → E4D8FF</span></div>
<div class="s" style="background:linear-gradient(150deg,var(--g-informe-1),var(--g-informe-2))"><b>informe</b><span class="hex">FFE6BC → FFD2D6</span></div>
<div class="s" style="background:linear-gradient(150deg,var(--g-transforme-1),var(--g-transforme-2))"><b>transforme</b><span class="hex">E5D8FF → D2E4FF</span></div>
<div class="s" style="background:linear-gradient(150deg,var(--g-digitalise-1),var(--g-digitalise-2))"><b>digitalise</b><span class="hex">BEF2EA → D8ECFF</span></div>
<div class="s" style="background:linear-gradient(150deg,var(--g-rose-1),var(--g-rose-2))"><b>rose</b><span class="hex">FFD5D9 → FFE7C7</span></div>
</div></body></html>
