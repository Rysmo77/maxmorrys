<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--f-body);color:var(--ink);background:#FBFCFE;padding:18px}*{box-sizing:border-box}.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}.hex{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}.c{height:52px}.m{padding:7px 9px;background:#fff}</style></head><body>
<div class="g">

<div class="s"><div class="c" style="background:var(--mm-orange-c)"></div><div class="m"><span class="hex">#FFDCA8</span></div></div>
<div class="s"><div class="c" style="background:var(--mm-violet-c)"></div><div class="m"><span class="hex">#DFD0FF</span></div></div>
<div class="s"><div class="c" style="background:var(--mm-teal-c)"></div><div class="m"><span class="hex">#A8EEE4</span></div></div>
<div class="s"><div class="c" style="background:var(--mm-rose-c)"></div><div class="m"><span class="hex">#FFC9CE</span></div></div>
</div></body></html>
