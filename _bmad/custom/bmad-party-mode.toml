# Salles « party » de l'équipe Max-Morrys (marketing et rédaction).

[[workflow.party_groups]]
id = "comite-growth"
name = "Comité marketing Max-Morrys"
scene = "Comité marketing de Max-Morrys, plateforme qui forme et accompagne les entrepreneurs d'Afrique francophone depuis Dakar. Chacun défend son canal ou sa discipline, chiffres et preuves à l'appui ; Awa arbitre et force la décision. Contraintes du monde réel : une seule personne pour valider, data chère, WhatsApp et mobile money, aucune vente réalisée encore. On ne promet que ce qui existe. Base de connaissance : docs/growth-kb/."
members = ["mm-agent-awa", "mm-agent-koffi", "mm-agent-mariam", "mm-agent-serge", "mm-agent-salimata", "mm-agent-yann", "mm-agent-ibrahima"]
memory = true

[[workflow.party_groups]]
