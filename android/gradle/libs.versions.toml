# ═══════════════════════════════════════════════════════════════════════════════
# Catalogue de versions — la SEULE déclaration de version du projet Android.
# Aucun `implementation("groupe:artefact:1.2.3")` en dur dans un build.gradle.kts :
# une version qui vit à deux endroits finit par y vivre en deux valeurs.
# ═══════════════════════════════════════════════════════════════════════════════
[versions]
agp                = "9.4.0"
kotlin             = "2.4.10"
composeBom         = "2026.06.01"
coreKtx            = "1.15.0"
lifecycle          = "2.8.7"
activityCompose    = "1.9.3"
navigation         = "2.8.5"
serialization      = "1.7.3"
okhttp             = "4.12.0"
datastore          = "1.1.1"
biometric          = "1.2.0-alpha05"
media3             = "1.5.1"
browser            = "1.8.0"
splashscreen       = "1.0.1"
firebaseBom        = "34.18.0"
junit              = "4.13.2"
androidxJunit      = "1.2.1"
espresso           = "3.6.1"

[libraries]
core-ktx                 = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx    = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel      = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose         = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

compose-bom              = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui               = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics      = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling       = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-prev  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation       = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3        = { group = "androidx.compose.material3", name = "material3" }
compose-ui-test-junit4   = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

navigation-compose       = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
serialization-json       = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp                   = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
datastore-preferences    = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
biometric                = { group = "androidx.biometric", name = "biometric-ktx", version.ref = "biometric" }
media3-exoplayer         = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session           = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
browser                  = { group = "androidx.browser", name = "browser", version.ref = "browser" }
splashscreen             = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# ⛔ LA NOMENCLATURE FIREBASE FIXE LES VERSIONS DE TOUTE LA FAMILLE, et c'est le seul
# usage sain : `firebase-auth` entraîne une douzaine d'artefacts Google qui doivent
# s'accorder entre eux. En épingler un seul à la main, c'est signer une incompatibilité
# pour dans six mois.
#
# ⚠️ `firebase-auth` N'ENTRAÎNE PAS `firebase-installations` — vérifié sur les POM de
# `firebase-auth:24.2.0` et `firebase-common:22.2.0`, pas supposé. Aucun Installation ID
# n'est donc fabriqué, et la phrase de l'inventaire de collecte à ce sujet reste vraie.
#
# ⚠️ Il entraîne EN REVANCHE `com.google.android.play:integrity` et
# `com.google.android.recaptcha` — deux dispositifs de prévention d'abus qui lisent des
# signaux d'appareil. Ce ne sont pas des permissions, donc aucune porte de manifeste ne
# les voit : ils sont déclarés à la main dans `store/confidentialite/inventaire-collecte.md`.
firebase-bom             = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth            = { group = "com.google.firebase", name = "firebase-auth" }

junit                    = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit           = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core            = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
