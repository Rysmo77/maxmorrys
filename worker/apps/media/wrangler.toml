# Cloudflare Worker — endpoint d'upload des médias vers R2.
# Déploiement : `cd worker && npm install && npm -w @mm/media-worker run deploy`
# Dév local   : `cd worker && npm -w @mm/media-worker run dev`

name = "maxmorrys-media"
main = "src/index.ts"
compatibility_date = "2024-11-27"

# Expose le Worker sur media-api.maxmorrys.me (domaine géré par Cloudflare).
# Le domaine doit exister dans la zone Cloudflare ; `custom_domain = true` crée
# automatiquement l'enregistrement.
routes = [
  { pattern = "media-api.maxmorrys.me", custom_domain = true },
  # Lecture des médias. La route Worker s'exécute avant le domaine public R2,
  # ce qui permet de protéger certains préfixes sans toucher au bucket.
  # Rollback : supprimer cette route — R2 reprend la main immédiatement.
  { pattern = "media.maxmorrys.me/*", zone_name = "maxmorrys.me" }
]

# Bucket R2 (lecture publique servie séparément via media.maxmorrys.me).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "maxmorrys-lms"

[vars]
# ⚠️ À confirmer : l'ID du projet Firebase (= `aud` des ID tokens). Le bucket est
# `max-morrys.firebasestorage.app`, le project_id est donc très probablement "max-morrys".
FIREBASE_PROJECT_ID = "max-morrys"

# Domaine public de lecture R2 (sans slash final).
PUBLIC_MEDIA_BASE = "https://media.maxmorrys.me"

# Origines autorisées à appeler l'API (CORS), séparées par des virgules.
ALLOWED_ORIGINS = "https://maxmorrys.me,https://www.maxmorrys.me,http://localhost:5173"

# UIDs autorisés à écrire dans les dossiers admin (uploads/, club_events/, club_sessions/),
# séparés par des virgules. Un token portant le custom claim `admin: true` est aussi accepté.
ADMIN_UIDS = ""
