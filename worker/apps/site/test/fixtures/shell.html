    <!--
      LES TROIS FAMILLES DU KIT — Fraunces, Schibsted Grotesk, JetBrains Mono.

      CE LIEN CHARGEAIT INTER, QUE PLUS RIEN N'UTILISE. Les familles du système sont
      déclarées dans `design-system/css/tokens/fonts.css`, et `tailwind.config.js` fait
      pointer `display` / `sans` / `mono` dessus. Recherche de « Inter » comme
      `font-family` dans tout le dépôt : aucune occurrence — les seules correspondances
      textuelles sont `setInterval` et `isIntersecting`. C'était donc une requête
      bloquante pour zéro pixel rendu, sur un marché où le panier de 2 Go coûte 4,2 %
      du revenu national brut par habitant.

      POURQUOI LE LIEN RESTE, AVEC LA BONNE URL. `fonts.css` charge les vraies fontes par
      `@import` DEPUIS L'INTÉRIEUR du CSS, ce qui sérialise la chaîne : HTML → index.css
      → découverte de l'URL Google → feuille Google → woff2. Quatre allers-retours avant
      le premier texte dans la bonne fonte, sur des terminaux dont le profil courant est
      `deviceMemory ≤ 2`. Déclarer la même URL ici la fait partir dès l'analyse du HTML ;
      l'`@import` la retrouve alors en cache.

      ⚠️ L'URL EST DUPLIQUÉE AVEC `tokens/fonts.css`, ET ELLE DOIT LE RESTER À
      L'IDENTIQUE — c'est ce qui permet au navigateur de dédupliquer la requête. Le
      fichier de jetons est une copie littérale du kit (AD-1) : on n'y touche pas, on
      s'aligne dessus. `tests/unit/fonts-sync.test.ts` échoue si les deux divergent.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" /></noscript>
    <title>Max-Morrys | Maîtrise le digital, accélère ta croissance</title>

    <!-- Google Consent Mode v2 (must load BEFORE GTM) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Restore saved consent from localStorage (if user has already chosen)
      (function(){
        try {
          var raw = localStorage.getItem('mm-cookie-consent');
          var saved = raw ? JSON.parse(raw) : null;
          var analytics = saved && saved.analytics ? 'granted' : 'denied';
          var marketing = saved && saved.marketing ? 'granted' : 'denied';
          gtag('consent', 'default', {
            ad_storage: marketing,
            ad_user_data: marketing,
            ad_personalization: marketing,
            analytics_storage: analytics,
            functionality_storage: 'granted',
            security_storage: 'granted',
            wait_for_update: 500
          });
        } catch(e) {
          gtag('consent', 'default', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: 'denied',
            functionality_storage: 'granted',
            security_storage: 'granted',
            wait_for_update: 500
          });
        }
      })();
    </script>

    <!--
      GOOGLE TAG MANAGER — L'IDENTIFIANT VIENT DE L'ENVIRONNEMENT, ET C'EST LE POINT.

      Il était écrit en dur. Conséquence mesurable : chaque `npm run dev` et chaque canal de
      preview émettait dans LA MÊME propriété GA4 et LE MÊME Pixel que la production. Les
      chiffres sur lesquels se prennent les décisions comptaient donc aussi les sessions de
      développement — sans qu'aucun rapport ne puisse les distinguer.

      Vite substitue les jetons `VITE_*` encadrés de pourcents dans ce fichier au moment du
      build. La garde `indexOf('GTM-')` n'est pas une ceinture de sécurité de plus : SANS
      ELLE, un environnement qui ne définit pas la variable laisse le jeton NON SUBSTITUÉ
      dans le code, et le snippet part chercher un conteneur qui n'existe pas.
      Avec elle, l'absence de variable coupe la mesure — ce qui est exactement le
      comportement voulu hors production.

      La CI passe une valeur de repli explicite (`.github/workflows/ci.yml`), pour qu'une
      variable de dépôt oubliée ne puisse jamais éteindre la mesure en production.
    -->
    <script>(function(w,d,s,l,i){if(i.indexOf('GTM-')!==0)return;w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','%VITE_GTM_ID%');</script>
    <!-- End Google Tag Manager -->

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    (function(){
      try {
        var raw = localStorage.getItem('mm-cookie-consent');
        var saved = raw ? JSON.parse(raw) : null;
        if (saved && saved.marketing) {
          fbq('consent', 'grant');
        } else {
          fbq('consent', 'revoke');
        }
      } catch(e) { fbq('consent', 'revoke'); }
    })();
    /* Même raison que pour GTM : un identifiant absent NE DOIT PAS initialiser le Pixel.
       Un Pixel initialisé sur un identifiant vide envoie quand même des requêtes. */
    var mmPixelId = '%VITE_META_PIXEL_ID%';
    if (/^[0-9]+$/.test(mmPixelId)) fbq('init', mmPixelId);
    </script>
    <!-- End Meta Pixel Code -->

    <!--
      GOOGLE TAG MANAGER (noscript) — SEUL ENDROIT OÙ L'IDENTIFIANT RESTE LITTÉRAL.

      Il ne peut PAS porter le jeton de variable : le plugin `vite:build-html` passe chaque
      attribut d'URL à `decodeURI`, et un jeton non substitué n'est pas un échappement
      pourcent valide — le build échoue avec « URI malformed ». Vérifié, pas supposé.

      Le laisser en dur ne rouvre pas le défaut qu'on corrige : ce repli ne s'exécute QUE
      chez un visiteur sans JavaScript, alors que la pollution des chiffres venait des
      sessions de développement et de preview, qui en ont. `tests/unit/tags-mesure.test.ts`
      exige donc les variables sur le chemin JS, et tolère la valeur littérale ici.
    -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PJ3R433M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Meta Pixel noscript — identifiant littéral, même raison que GTM ci-dessus. -->
    <noscript><img height="1" width="1" style="display:none" alt=""
    src="https://www.facebook.com/tr?id=925361066071417&ev=PageView&noscript=1"
    /></noscript>
